<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="compact-container">
        <header class="top-header">
            <h1>💰 Expense Tracker</h1>
            <div class="top-actions">
                <select id="displayCurrency" class="currency-selector" onchange="updateDisplay()">
    <option value="USD">USD $</option>
    <option value="EUR">EUR €</option>
    <option value="GBP">GBP £</option>
    <option value="JPY">JPY ¥</option>
    <option value="CNY">CNY ¥</option>
    <option value="INR">INR ₹</option>
    <option value="KRW">KRW ₩</option>
    <option value="BDT">BDT ৳</option>
    <option value="NPR">NPR Rs</option>
    <option value="AUD">AUD $</option>
    <option value="CAD">CAD $</option>
    <option value="CHF">CHF Fr</option>
</select>
                <button onclick="toggleDarkMode()" class="icon-btn-top">
                    <span id="darkModeIcon">🌙</span>
                </button>
                <button onclick="startVoiceRecognition()" class="action-btn-top" id="voiceBtn">🎤 Voice Add</button>
                <button onclick="toggleAddForm()" class="action-btn-top" id="addBtn">+ Add Expense</button>
                <button onclick="toggleIncomeForm()" class="action-btn-top" id="addIncomeBtn">💰 Add Income</button>
                <button onclick="showUserMenu()" class="icon-btn-top" id="userMenuBtn">👤</button>
                <div id="userMenu" class="user-menu" style="display: none;">
                <div class="user-menu-header">
                        <strong id="userName">User</strong>
                        <div id="userEmail"></div>
                 </div>
                        <a href="/settings" class="user-menu-item" style="display: block; text-decoration: none; color: inherit;">⚙️ Account Settings</a>
                        <button onclick="handleLogout()" class="user-menu-item">🚪 Logout</button>
                </div>
            </div>
        </header>

        <div class="note-text">Exchange rates updated: <span id="ratesUpdate">Loading...</span></div>

        <div id="voiceStatus" class="voice-inline" style="display: none;">
            <span class="pulse-icon">🎤</span>
            <span>Listening...</span>
            <button onclick="stopVoiceRecognition()" class="close-btn">✕</button>
        </div>

        <div id="voiceResult" class="voice-inline" style="display: none;">
            <span><strong><span id="voiceCurrencySymbol">$</span><span id="voiceAmount">0</span></strong> • <span id="voiceCategory">-</span> • <span id="voiceDescription">-</span></span>
            <div>
                <button onclick="confirmVoiceExpense()" class="mini-btn success">✓</button>
                <button onclick="cancelVoiceExpense()" class="mini-btn cancel">✕</button>
            </div>
        </div>

        <div id="expenseForm" class="add-form-inline" style="display: none;">
            <input type="hidden" id="editExpenseId">
            <div class="input-with-rate">
                <input type="number" id="amount" step="0.01" placeholder="Amount" class="input-compact" oninput="updateExpenseRate()">
                <span class="exchange-rate-hint" id="expenseRateHint"></span>
            </div>
            <select id="expenseCurrency" class="input-compact" onchange="updateExpenseRate()">
                <option value="USD">USD $</option>
                <option value="EUR">EUR €</option>
                <option value="GBP">GBP £</option>
                <option value="JPY">JPY ¥</option>
                <option value="CNY">CNY ¥</option>
                <option value="INR">INR ₹</option>
                <option value="KRW">KRW ₩</option>
                <option value="BDT">BDT ৳</option>
                <option value="NPR">NPR Rs</option>
                <option value="AUD">AUD $</option>
                <option value="CAD">CAD $</option>
                <option value="CHF">CHF Fr</option>
            </select>
            <select id="category" class="input-compact">
                <option>Food & Dining</option>
                <option>Transportation</option>
                <option>Shopping</option>
                <option>Entertainment</option>
                <option>Bills & Utilities</option>
                <option>Healthcare</option>
                <option>Education</option>
                <option>Other</option>
            </select>
            <input type="text" id="description" placeholder="Description" class="input-compact">
            <input type="date" id="date" class="input-compact">
            <button onclick="saveExpense()" class="mini-btn success" id="saveBtn">Save</button>
            <button onclick="toggleAddForm()" class="mini-btn cancel">Cancel</button>
        </div>

        <div id="incomeForm" class="add-form-inline" style="display: none;">
            <input type="hidden" id="editIncomeId">
            <div class="input-with-rate">
                <input type="number" id="incomeAmount" step="0.01" placeholder="Amount Received" class="input-compact" oninput="updateIncomeRate()">
                <span class="exchange-rate-hint" id="incomeRateHint"></span>
            </div>
            <select id="incomeCurrency" class="input-compact" onchange="updateIncomeRate()">
                <option value="USD">USD $</option>
                <option value="EUR">EUR €</option>
                <option value="GBP">GBP £</option>
                <option value="JPY">JPY ¥</option>
                <option value="CNY">CNY ¥</option>
                <option value="INR">INR ₹</option>
                <option value="KRW">KRW ₩</option>
                <option value="BDT">BDT ৳</option>
                <option value="NPR">NPR Rs</option>
                <option value="AUD">AUD $</option>
                <option value="CAD">CAD $</option>
                <option value="CHF">CHF Fr</option>
            </select>
            <input type="text" id="incomeDescription" placeholder="Source (e.g., Salary, Gift)" class="input-compact">
            <input type="date" id="incomeDate" class="input-compact">
            <button onclick="saveIncome()" class="mini-btn success" id="saveIncomeBtn">Save Income</button>
            <button onclick="toggleIncomeForm()" class="mini-btn cancel">Cancel</button>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <select id="monthSelector" class="month-select"></select>
            </div>
            <div class="stat-box">
                <div class="stat-label">Income</div>
                <div class="stat-value" id="totalIncome">₩0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Total Spending</div>
                <div class="stat-value" id="totalSpending">₩0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Transactions</div>
                <div class="stat-value" id="totalTransactions">0</div>
            </div>
            <div class="stat-box highlight">
                <div class="stat-label">Saved</div>
                <div class="stat-value" id="savedAmount">₩0</div>
                <div class="stat-percentage" id="savingsPercentage">0%</div>
            </div>
        </div>

        <div class="content-grid">
            <div class="transactions-box">
                <h3>Recent Transactions</h3>
                <div id="transactionsList" class="transactions-scroll">
                    <div class="no-data">No transactions this month</div>
                </div>
            </div>
            <div class="chart-box">
                <h3>Spending by Category</h3>
                <canvas id="categoryChart"></canvas>
            </div>
            <div class="chart-box">
                <h3>Monthly Trend</h3>
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
